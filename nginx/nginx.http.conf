# SamaDokita — config HTTP-only (bootstrap sans certificats TLS).
# Utiliser temporairement en remplacement de nginx.conf AVANT d'obtenir des certs.
# Bascule : modifier le volume dans docker-compose.yml pour monter ce fichier.
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 2048; multi_accept on; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; server_tokens off;
  client_max_body_size 20m;

  gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 256;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  upstream frontend { server frontend:3000; keepalive 32; }
  upstream backend  { server backend:3001;  keepalive 32; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location ~ ^/api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location /api/ {
      limit_req zone=global burst=30 nodelay;
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }
  }
}
