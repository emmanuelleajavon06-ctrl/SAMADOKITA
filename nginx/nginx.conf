worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- Performance ---
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens   off;

  # --- Buffers (requêtes médicales / uploads) ---
  client_max_body_size 20m;
  client_body_buffer_size 128k;
  large_client_header_buffers 4 16k;

  # --- Gzip ---
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    image/svg+xml;

  # --- Cache proxy (assets Next.js immuables) ---
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nextcache:64m max_size=1g inactive=60m use_temp_path=off;

  # --- Logs ---
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # --- Upstreams ---
  upstream frontend { server frontend:3000; keepalive 32; }
  upstream backend  { server backend:3001;  keepalive 32; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # --- Rate limiting ---
  limit_req_zone  $binary_remote_addr zone=global:10m rate=100r/m;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=connlimit:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Redirection HTTP → HTTPS
  server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # --- Serveur principal (TLS) ---
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samadokita.sn www.samadokita.sn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (180 jours) — à activer seulement si HTTPS est garanti
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # --- En-têtes de sécurité ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # CSP : désactivée par défaut pour ne pas casser Next.js/Leaflet. Activer après test :
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: ws: wss:; frame-ancestors 'none';" always;

    limit_conn connlimit 50;

    # --- Auth (rate-limit strict : 10 req/min) ---
    location ~ ^/api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Upgrade           $http_upgrade;
    }

    # --- API + WebSocket (strip du préfixe /api) ---
    location /api/ {
      limit_req zone=global burst=30 nodelay;
      proxy_pass http://backend/;   # le '/' final supprime '/api/'
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # --- Frontend Next.js (standalone) ---
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_cache nextcache;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
    }
  }
}
