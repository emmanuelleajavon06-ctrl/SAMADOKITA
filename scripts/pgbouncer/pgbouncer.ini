[databases]
${DB_NAME} = host=${DB_HOST} port=${DB_PORT}
* = host=${DB_HOST} port=${DB_PORT}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling = compatible Prisma / pg (pas de prepared statements persistants)
pool_mode = transaction
; Prisma utilise des prepared statements nommés → PgBouncer ≥1.21 doit les tracker (≥1.21 requis)
max_prepared_statements = 100
max_client_conn = ${PGBOUNCER_MAX_CLIENT_CONN}
default_pool_size = ${PGBOUNCER_DEFAULT_POOL_SIZE}
min_pool_size = ${PGBOUNCER_MIN_POOL_SIZE}
reserve_pool_size = ${PGBOUNCER_RESERVE_POOL_SIZE}
reserve_pool_timeout = 5

; Reconnexions saines vers Postgres
server_connect_timeout = 15
server_login_retry = 3
server_lifetime = 3600
server_idle_timeout = 600

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Administrative
admin_users = ${DB_USER}
ignore_startup_parameters = extra_float_digits,options
