name: Deploy — Render

# Déclenché après une CI VERTHEUSE sur main, ou manuellement (workflow_dispatch).
# Méthode : Render REST API (déploie chaque service du monorepo).
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   RENDER_API_KEY              → clé API Render (Account → API Keys)
#   RENDER_BACKEND_SERVICE_ID   → ID du Web Service "backend"  (URL .../srv-XXXX)
#   RENDER_FRONTEND_SERVICE_ID  → ID du Web Service "frontend" (URL .../srv-YYYY)
#
# Si un secret est absent, le service correspondant est simplement ignoré
# (utile pour n'en déployer qu'un seul).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deploys
    runs-on: ubuntu-latest
    # Uniquement si la CI est verte (sur workflow_run) ou déclenché à la main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Deploy backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "⏭  Render backend non configuré (RENDER_API_KEY / RENDER_BACKEND_SERVICE_ID) — ignoré."
            exit 0
          fi
          echo "🚀 Déploiement Render — backend ($RENDER_SERVICE_ID)..."
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" | cat
          echo ""

      - name: Deploy frontend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "⏭  Render frontend non configuré (RENDER_API_KEY / RENDER_FRONTEND_SERVICE_ID) — ignoré."
            exit 0
          fi
          echo "🚀 Déploiement Render — frontend ($RENDER_SERVICE_ID)..."
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" | cat
          echo ""
