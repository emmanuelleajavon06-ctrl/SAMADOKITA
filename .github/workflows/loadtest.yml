name: Load Test (k6)

# Test de charge COMPLET (pic ~1200 utilisateurs simultanés, ≈16 min, intensif).
# Déclenché MANUELLEMENT uniquement (workflow_dispatch) — pas sur chaque push.
#
# Secrets requis :
#   TEST_EMAIL     → email d'un compte existant et actif
#   TEST_PASSWORD  → mot de passe de ce compte
#
# Le compte doit être ADMIN_INFRA (créé via /auth/register) avec abonnement actif.

on:
  workflow_dispatch:
    inputs:
      target_rps:
        description: "Pic de charge (modifie k6/load-test.js stages pour un vrai change)"
        required: false
        default: "1200 (voir k6/load-test.js)"

jobs:
  load:
    name: k6 — test de charge
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samadokita
          POSTGRES_PASSWORD: samadokita_pass
          POSTGRES_DB: samadokita
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://samadokita:samadokita_pass@localhost:5432/samadokita?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-9f4c2e7b1a8d3f6c0e5b2a9d7c1f4e8b
      JWT_REFRESH_SECRET: ci-refresh-3b7f1c9e2a5d8b0f6c4e1a7d9b3f5c2e
      WEBHOOK_SECRET: ci-webhook-7d2a9f1c4b8e0a5f3c6d1b9e2a7f4c8d
      MINIO_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Start backend
        working-directory: ./backend
        run: |
          nohup node dist/main > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:3001/health/live > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Backend non démarré"; cat /tmp/backend.log || true; exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 load test
        working-directory: ./k6
        env:
          API_URL: http://localhost:3001
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: k6 run load-test.js

      - name: Dump backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true
