name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samadokita
          POSTGRES_PASSWORD: samadokita_pass
          POSTGRES_DB: samadokita
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://samadokita:samadokita_pass@localhost:5432/samadokita?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-9f4c2e7b1a8d3f6c0e5b2a9d7c1f4e8b
      JWT_REFRESH_SECRET: ci-refresh-3b7f1c9e2a5d8b0f6c4e1a7d9b3f5c2e
      WEBHOOK_SECRET: ci-webhook-7d2a9f1c4b8e0a5f3c6d1b9e2a7f4c8d
      MINIO_ENDPOINT: http://localhost:9000
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          nohup node dist/main > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for server
        run: |
          echo "Attente de /health/live ..."
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/health/live > /dev/null 2>&1; then
              echo "Backend prêt (après ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "=== Backend non démarré — log ==="
          cat /tmp/backend.log || true
          exit 1

      - name: Health check
        run: curl -fsS http://localhost:3001/health/live

      - name: End-to-end tests
        run: node ../tests/e2e/run-e2e.mjs

      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
